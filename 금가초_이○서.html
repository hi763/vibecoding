<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피아노 연주 게임</title>
    <style>
        :root {
            --color-1: #ff4d4d; /* 도: 빨강 */
            --color-2: #ffea00; /* 레: 노랑 */
            --color-3: #4caf50; /* 미: 초록 */
            --color-4: #2196f3; /* 파: 파랑 */
            --color-5: #9c27b0; /* 솔: 보라 */
        }

        body {
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #222;
            border: 4px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }

        /* 상단 정보 */
        #info-bar {
            display: flex;
            justify-content: space-around;
            width: 400px;
            padding: 10px;
            background: #333;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        /* 판정 라인 */
        #judge-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            z-index: 2;
        }

        /* 떨어지는 노트 */
        .note {
            position: absolute;
            width: 78px;
            height: 20px;
            border-radius: 5px;
            z-index: 1;
        }

        /* 건반 영역 */
        #keyboard {
            display: flex;
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #000;
        }

        .key {
            flex: 1;
            border: 1px solid #333;
            background: white;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            font-weight: bold;
            transition: 0.1s;
        }

        /* 키 눌렀을 때 색상 클래스 */
        .key.active-1 { background-color: var(--color-1) !important; color: white; }
        .key.active-2 { background-color: var(--color-2) !important; color: black; }
        .key.active-3 { background-color: var(--color-3) !important; color: white; }
        .key.active-4 { background-color: var(--color-4) !important; color: white; }
        .key.active-5 { background-color: var(--color-5) !important; color: white; }

        /* 메시지 레이어 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
        #combo-text { font-size: 24px; color: #ffeb3b; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="info-bar">
        <div>레벨: <span id="level">1</span></div>
        <div>점수: <span id="score">0</span></div>
        <div>목숨: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <div id="game-container">
        <div id="judge-line"></div>
        <div id="notes-container"></div>
        
        <div id="keyboard">
            <div class="key" id="key-1">도(1)</div>
            <div class="key" id="key-2">레(2)</div>
            <div class="key" id="key-3">미(3)</div>
            <div class="key" id="key-4">파(4)</div>
            <div class="key" id="key-5">솔(5)</div>
        </div>

        <div id="overlay">
            <h1 id="msg">피아노 연주 게임</h1>
            <p id="sub-msg">숫자키 1, 2, 3, 4, 5를 사용하세요!</p>
            <button onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <div id="combo-text"></div>

    <script>
        const notesContainer = document.getElementById('notes-container');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const msg = document.getElementById('msg');

        let score = 0;
        let lives = 3;
        let level = 1;
        let gameActive = false;
        let noteSpeed = 3;
        let spawnRate = 1200;
        let activeNotes = [];
        let spawnInterval;

        const colors = {
            1: '#ff4d4d',
            2: '#ffea00',
            3: '#4caf50',
            4: '#2196f3',
            5: '#9c27b0'
        };

        // 레벨 설정 (속도, 생성 주기, 목표 점수)
        const levelConfig = [
            { speed: 3, rate: 1200, goal: 50 },
            { speed: 4, rate: 1000, goal: 150 },
            { speed: 5, rate: 800, goal: 300 },
            { speed: 6, rate: 650, goal: 500 },
            { speed: 8, rate: 500, goal: 99999 }
        ];

        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameActive = true;
            activeNotes = [];
            notesContainer.innerHTML = '';
            overlay.classList.add('hidden');
            updateUI();
            applyLevelSettings();
            gameLoop();
        }

        function applyLevelSettings() {
            const config = levelConfig[level - 1];
            noteSpeed = config.speed;
            spawnRate = config.rate;
            
            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnNote, spawnRate);
        }

        function spawnNote() {
            if (!gameActive) return;
            const lane = Math.floor(Math.random() * 5) + 1;
            const note = document.createElement('div');
            note.className = 'note';
            note.style.left = (lane - 1) * 80 + 'px';
            note.style.top = '-20px';
            note.style.backgroundColor = colors[lane];
            note.dataset.lane = lane;
            notesContainer.appendChild(note);
            activeNotes.push({ el: note, top: -20, lane: lane });
        }

        function gameLoop() {
            if (!gameActive) return;

            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const note = activeNotes[i];
                note.top += noteSpeed;
                note.el.style.top = note.top + 'px';

                // 노트를 놓쳤을 때 (화면 아래로 나감)
                if (note.top > 600) {
                    note.el.remove();
                    activeNotes.splice(i, 1);
                    missNote();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function missNote() {
            lives--;
            updateUI();
            if (lives <= 0) endGame("GAME OVER");
        }

        function updateUI() {
            scoreEl.innerText = score;
            levelEl.innerText = level;
            livesEl.innerText = "❤️".repeat(lives);
        }

        // 키 입력 처리
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            const key = e.key;
            if (['1', '2', '3', '4', '5'].includes(key)) {
                const lane = parseInt(key);
                const keyEl = document.getElementById(`key-${lane}`);
                
                // 건반 색상 변경
                keyEl.classList.add(`active-${lane}`);

                // 판정 (판정 라인 근처에 있는 노드가 있는지 확인)
                const hitNoteIndex = activeNotes.findIndex(n => 
                    n.lane === lane && n.top > 450 && n.top < 530
                );

                if (hitNoteIndex !== -1) {
                    score += 10;
                    activeNotes[hitNoteIndex].el.remove();
                    activeNotes.splice(hitNoteIndex, 1);
                    checkLevelUp();
                    updateUI();
                } else {
                    // 아무것도 없는데 눌렀을 때도 목숨 차감 (선택 사항)
                    // missNote(); 
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if (['1', '2', '3', '4', '5'].includes(key)) {
                const lane = parseInt(key);
                const keyEl = document.getElementById(`key-${lane}`);
                keyEl.classList.remove(`active-${lane}`);
            }
        });

        function checkLevelUp() {
            if (level < 5 && score >= levelConfig[level - 1].goal) {
                level++;
                if (level === 5) {
                    // 마지막 레벨 알림 등 추가 가능
                }
                applyLevelSettings();
            }
        }

        function endGame(text) {
            gameActive = false;
            clearInterval(spawnInterval);
            overlay.classList.remove('hidden');
            msg.innerText = text;
            document.querySelector('#overlay button').innerText = "다시 시도";
        }

    </script>
</body>
</html>
