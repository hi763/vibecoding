<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>캣 점프 무한 등반 - 시간 표시</title>

<style>

body{

    margin:0;

    overflow:hidden;

    background:#87ceeb;

    touch-action:manipulation;

}



canvas{

    display:block;

}



#ui{

    position:absolute;

    top:10px;

    left:10px;

    color:white;

    font-family:sans-serif;

    font-size:24px;

    font-weight:bold;

}



#gameOver{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    color:white;

    background:rgba(0,0,0,0.6);

    font-family:sans-serif;

}



button{

    padding:12px 24px;

    font-size:18px;

    cursor:pointer;

}

</style>

</head>

<body>

<div id="ui">시간: <span id="time">0</span>초</div>



<div id="gameOver">

    <h1>게임 오버</h1>

    <button onclick="restart()">다시 시작</button>

</div>



<canvas id="game"></canvas>



<script>

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");



function resize(){

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);



let cat, obstacles, running, started;

let cameraY = 0;

let highestObstacleY = 0;

let startTime = 0;



function init(){

    cat = {

        x: canvas.width/2,

        y: canvas.height - 100,

        size: 25,

        dir: 1,

        speedX: 5,

        speedY: 0 // 시작 전 정지

    };



    obstacles = [];

    running = true;

    started = false;

    cameraY = cat.y - canvas.height*0.7;

    highestObstacleY = cat.y;



    startTime = 0;

    document.getElementById("time").textContent = startTime;

    document.getElementById("gameOver").style.display="none";



    // 초기 장애물

    for(let i=0;i<10;i++){

        createObstacle(cat.y - i*250);

    }

}



function createObstacle(y){

    const gap = 120;

    obstacles.push({

        x: Math.random()*(canvas.width-gap),

        y: y,

        w: 80 + Math.random()*80,

        h: 20

    });

    if(y < highestObstacleY) highestObstacleY = y;

}



function tap(){

    if(!running) return;



    if(!started){

        // 게임 시작

        cat.speedY = -4;

        started = true;

        startTime = Date.now();

    } else {

        // 방향 전환

        cat.dir *= -1;

    }

}



canvas.addEventListener("click", tap);

canvas.addEventListener("touchstart", e=>{

    e.preventDefault();

    tap();

},{passive:false});



function update(){

    if(!started) return;



    // 고양이 이동

    cat.x += cat.speedX * cat.dir;

    cat.y += cat.speedY;



    // 벽 충돌

    if(cat.x < cat.size){

        cat.x = cat.size;

        cat.dir = 1;

    }

    if(cat.x > canvas.width - cat.size){

        cat.x = canvas.width - cat.size;

        cat.dir = -1;

    }



    // 카메라

    const cameraTarget = cat.y - canvas.height*0.7;

    cameraY += (cameraTarget - cameraY)*0.1;



    // 무한 장애물 생성

    if(highestObstacleY > cat.y - 1000){

        createObstacle(highestObstacleY - 250);

    }



    // 시간 계산

    const elapsed = Math.floor((Date.now() - startTime)/1000);

    document.getElementById("time").textContent = elapsed;



    // 충돌 체크

    obstacles.forEach(o=>{

        if(cat.x + cat.size > o.x &&

           cat.x - cat.size < o.x + o.w &&

           cat.y + cat.size > o.y &&

           cat.y - cat.size < o.y + o.h){

            gameOver();

        }

    });

}



function drawCat(){

    const screenY = cat.y - cameraY;

    ctx.save();

    ctx.translate(cat.x, screenY);



    // 몸

    ctx.fillStyle="#ffb74d";

    ctx.beginPath();

    ctx.arc(0,0,cat.size,0,Math.PI*2);

    ctx.fill();



    // 귀

    ctx.beginPath();

    ctx.moveTo(-15,-15);

    ctx.lineTo(-5,-35);

    ctx.lineTo(0,-12);

    ctx.fill();



    ctx.beginPath();

    ctx.moveTo(15,-15);

    ctx.lineTo(5,-35);

    ctx.lineTo(0,-12);

    ctx.fill();



    // 눈

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.arc(-8,-3,2,0,Math.PI*2);

    ctx.arc(8,-3,2,0,Math.PI*2);

    ctx.fill();



    ctx.restore();

}



function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);



    // 벽

    ctx.fillStyle="#444";

    ctx.fillRect(0,0,20,canvas.height);

    ctx.fillRect(canvas.width-20,0,20,canvas.height);



    // 장애물

    ctx.fillStyle="#e53935";

    obstacles.forEach(o=>{

        const screenY = o.y - cameraY;

        ctx.fillRect(o.x, screenY, o.w, o.h);

    });



    drawCat();

}



function loop(){

    if(running){

        update();

        draw();

        requestAnimationFrame(loop);

    }

}



function gameOver(){

    running = false;

    document.getElementById("gameOver").style.display="flex";

}



function restart(){

    init();

    loop();

}



init();

loop();

</script>

</body>

</html>
