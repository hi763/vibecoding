<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>2D Minecraft 2/10</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87ceeb;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, .8);
            padding: 10px;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="ui">
        선택 블록:
        <span id="selected">흙</span><br>
        1=흙 2=나무 3=돌
    </div>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const TILE = 40;
        const ROWS = 20;
        const COLS = 60;
        const AIR = 0;
        const DIRT = 1;
        const GRASS = 2;
        const WOOD = 3;
        const STONE = 4;
        const DIAMOND = 5;
        let selectedBlock = DIRT;
        const world = [];
        for (let y = 0; y < ROWS; y++) {
            world[y] = [];
            for (let x = 0; x < COLS; x++) {
                if (y === 13) {
                    world[y][x] = GRASS;
                }
                else if (y > 13) {
                    if (Math.random() < 0.05) {
                        world[y][x] = DIAMOND;
                    }
                    else if (Math.random() < 0.35) {
                        world[y][x] = STONE;
                    }
                    else {
                        world[y][x] = DIRT;
                    }
                }
                else {
                    world[y][x] = AIR;
                }
            }
        }
        for (let i = 0; i < 12; i++) {
            let tx = Math.floor(Math.random() * COLS);
            if (tx < 2 || tx > COLS - 3) continue;
            world[12][tx] = WOOD;
            world[11][tx] = WOOD;
            world[10][tx] = WOOD;
            world[9][tx] = WOOD;
            world[8][tx] = WOOD;
            world[8][tx - 1] = GRASS;
            world[8][tx + 1] = GRASS;
            world[7][tx] = GRASS;
            world[7][tx - 1] = GRASS;
            world[7][tx + 1] = GRASS;
        }
        const player = {
            x: 200,
            y: 100,
            w: 30,
            h: 38,
            vx: 0,
            vy: 0,
            grounded: false
        };
        const keys = {};
        document.addEventListener("keydown", e => {
            keys[e.key] = true;
            if (e.key === "1") {
                selectedBlock = DIRT;
                selected.textContent = "흙";
            }
            if (e.key === "2") {
                selectedBlock = WOOD;
                selected.textContent = "나무";
            }
            if (e.key === "3") {
                selectedBlock = STONE;
                selected.textContent = "돌";
            }
        });
        document.addEventListener("keyup", e => {
            keys[e.key] = false;
        });
        canvas.addEventListener("click", e => {
            const rect = canvas.getBoundingClientRect();
            const mx = Math.floor((e.clientX - rect.left) / TILE);
            const my = Math.floor((e.clientY - rect.top) / TILE);
            if (world[my] && world[my][mx] !== undefined) {
                world[my][mx] = AIR;
            }
        });
        canvas.addEventListener("contextmenu", e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = Math.floor((e.clientX - rect.left) / TILE);
            const my = Math.floor((e.clientY - rect.top) / TILE);
            if (world[my] && world[my][mx] !== undefined) {
                world[my][mx] = selectedBlock;
            }
        });
        function update() {
            if (keys["ArrowLeft"]) {
                player.vx = -4;
            }
            else if (keys["ArrowRight"]) {
                player.vx = 4;
            }
            else {
                player.vx = 0;
            }
            if ((keys[" "] || keys["ArrowUp"]) && player.grounded) {
                player.vy = -12;
            }
            player.vy += 0.6;
            player.x += player.vx;
            player.y += player.vy;
            player.grounded = false;
            let tx = Math.floor((player.x + player.w / 2) / TILE);
            let ty = Math.floor((player.y + player.h) / TILE);
            if (world[ty] && world[ty][tx] !== AIR) {
                player.y = ty * TILE - player.h;
                player.vy = 0;
                player.grounded = true;
            }
            if (player.y > canvas.height) {
                player.x = 200;
                player.y = 100;
                player.vy = 0;
            }
        }
        function drawBlock(type, x, y) {
            if (type === DIRT) {
                ctx.fillStyle = "#8b5a2b";
            }
            if (type === GRASS) {
                ctx.fillStyle = "#33aa33";
            }
            if (type === WOOD) {
                ctx.fillStyle = "#a66a2c";
            }
            if (type === STONE) {
                ctx.fillStyle = "#888";
            }
            if (type === DIAMOND) {
                ctx.fillStyle = "#00ffff";
            }
            if (type !== AIR) {
                ctx.fillRect(x, y, TILE, TILE);
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    drawBlock(
                        world[y][x],
                        x * TILE,
                        y * TILE
                    );
                    ctx.strokeStyle = "rgba(0,0,0,.1)";
                    ctx.strokeRect(
                        x * TILE,
                        y * TILE,
                        TILE,
                        TILE
                    );
                }
            }
            ctx.fillStyle = "red";
            ctx.fillRect(
                player.x,
                player.y,
                player.w,
                player.h
            );
        }
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>

</html>
