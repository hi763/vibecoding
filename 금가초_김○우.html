<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival - Pure Hardcore Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #252b36; 
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 200, 100, 0.9);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ff3333; 
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
            font-size: 14px;
        }
        #hp-bar-container {
            width: 200px;
            height: 16px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff3333;
            box-shadow: 0 0 10px #ff0000;
        }
        #hp-bar {
            width: 100%;
            height: 100%;
            background: #cc0000;
            transition: width 0.1s;
        }
        #weapon-select {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 15, 0.9);
            color: #fff;
            padding: 8px;
            border: 1px solid #ff3333;
            border-radius: 4px;
            z-index: 10;
        }
        #weapon-select select {
            background: #111;
            color: #ff3333;
            border: 1px solid #555;
            padding: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.9);
            color: #fff;
            padding: 8px;
            border: 1px solid #444;
            font-size: 11px;
            z-index: 10;
            line-height: 1.4;
            border-radius: 4px;
        }
        #wave-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 5, 0.9);
            color: #ff3333;
            padding: 6px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ff0000;
            z-index: 11;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
        }

        /* 모바일 UI */
        #mobile-controls {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 15;
        }
        .touch-zone {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 0, 0, 0.03);
            border-radius: 50%;
        }
        #joystick-boundary {
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255,50,50,0.3);
        }
        #joystick-stick {
            position: absolute;
            top: 45px;
            left: 45px;
            width: 30px;
            height: 30px;
            background: rgba(255,0,0,0.4);
            border-radius: 50%;
        }
        #btn-attack {
            bottom: 50px;
            right: 40px;
            width: 95px;
            height: 95px;
            background: rgba(255, 0, 0, 0.2);
            border: 3px solid rgba(255, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffcccc;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        
        @media (max-width: 1024px) {
            #mobile-controls { display: block; }
            #instructions { display: none; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="wave-ui">WAVE 1</div>
    
    <div id="weapon-select">
        <select id="weapons" onchange="changeWeapon(this.value)">
            <option value="pistol">01. 9mm 전술 권총</option>
            <option value="smg">02. 전술 기관단총 (SMG-9)</option>
            <option value="rifle">03. 5.56mm 전술 소총 (AR-15)</option>
            <option value="sniper">04. 대구경 저격소총 (MSR)</option>
            <option value="shotgun">05. 근접전 산탄총</option>
            <option value="minigun">06. 중화기 미니건</option>
            <option value="laser">07. 프로토타입 레이저 부스터</option>
            <option value="flamer">08. 대좀비용 화염방사기</option>
            <option value="boltAction">09. 구형 볼트액션 포총</option>
            <option value="plasma">10. 헤비 플라즈마 캐논</option>
        </select>
    </div>

    <div id="instructions">
        <strong>💻 PC 조작 가이드</strong><br>
        - 이동: WASD / 사격: Spacebar<br>
        - 시점 변경: 마우스 드래그 또는 방향키<br>
        <span style="color:#00ff88;">* 장애물 충돌 시스템 가동 중 / 하드코어 생존</span>
    </div>

    <div id="mobile-controls">
        <div id="joystick-boundary" class="touch-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-attack" class="touch-zone">사격</div>
    </div>

    <div id="ui-container">
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div id="current-weapon-txt" style="margin-top:5px; font-weight:bold; color:#ff6666;">01. 9mm 전술 권총</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer;
        
        let player = {
            hp: 100, maxHp: 100, speed: 0.14,
            velocity: new THREE.Vector3(),
            moveForward: false, moveBackward: false, moveLeft: false, moveRight: false,
            turnLeft: false, turnRight: false, isShooting: false,
            lastHitTime: 0,
            invincibleDuration: 800 
        };

        let audioCtx = null;
        let bgmInterval = null;

        let joystickActive = false;
        let joystickStart = {x: 0, y: 0};
        let joystickMove = {x: 0, y: 0};

        let currentWave = 1;
        let isWaveTransitioning = false; 

        let gunMesh;
        let muzzleFlashLight; 
        let flashTimer = 0;   
        let flashParticles = []; 

        const weaponStats = {
            pistol: { name: '01. 9mm 전술 권총', color: 0xff5500, speed: 2.8, size: 0.04, dmg: 35, delay: 200, flashPos: -0.4 },
            smg: { name: '02. 전술 기관단총 (SMG-9)', color: 0xff5500, speed: 2.8, size: 0.04, dmg: 18, delay: 90, flashPos: -0.6 },
            rifle: { name: '03. 5.56mm 전술 소총 (AR-15)', color: 0xffaa44, speed: 3.5, size: 0.05, dmg: 32, delay: 130, flashPos: -0.9 },
            sniper: { name: '04. 대구경 저격소총 (MSR)', color: 0xffffff, speed: 5.5, size: 0.07, dmg: 160, delay: 1300, flashPos: -1.4 },
            shotgun: { name: '05. 근접전 산탄총', color: 0xff5500, speed: 2.5, size: 0.04, dmg: 18, delay: 750, count: 6, flashPos: -0.8 },
            minigun: { name: '06. 중화기 미니건', color: 0xffcc00, speed: 3.2, size: 0.04, dmg: 14, delay: 45, flashPos: -1.1 },
            laser: { name: '07. 프로토타입 레이저 부스터', color: 0x00ffff, speed: 6.0, size: 0.03, dmg: 12, delay: 35, flashPos: -1.0 },
            flamer: { name: '08. 대좀비용 화염방사기', color: 0xff3300, speed: 1.5, size: 0.18, dmg: 8, delay: 25, flashPos: -0.5 },
            boltAction: { name: '09. 구형 볼트액션 포총', color: 0xffaa00, speed: 4.0, size: 0.08, dmg: 95, delay: 900, flashPos: -1.2 },
            plasma: { name: '10. 헤비 플라즈마 캐논', color: 0x33ff33, speed: 2.0, size: 0.25, dmg: 75, delay: 500, flashPos: -1.0 }
        };
        
        let currentWeapon = 'pistol';
        let lastShotTime = 0;
        let bullets = [];
        let enemies = [];
        let obstacles = [];
        let medkits = []; 
        const mapSize = 40;
        let yaw = 0;
        const rotateSpeed = 0.04; 

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startSpookyBGM();
        }

        function startSpookyBGM() {
            let notes = [55, 51, 49, 51]; 
            let index = 0;

            bgmInterval = setInterval(() => {
                if(!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440 * Math.pow(2, (notes[index] - 69) / 12), audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
                
                index = (index + 1) % notes.length;
            }, 750); 
        }

        function playShootSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.13);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x8a99ad); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85); scene.add(ambientLight); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4); dirLight.position.set(10, 40, 10); scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const floorGeo = new THREE.PlaneGeometry(mapSize * 2, mapSize * 2);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xababab, roughness: 0.5 }); 
            const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI / 2; scene.add(floor);

            const grid = new THREE.GridHelper(mapSize * 2, 40, 0x667788, 0x99a9a9); grid.position.y = 0.01; scene.add(grid);

            gunMesh = new THREE.Group();
            gunMesh.position.set(0.2, -0.25, -0.4);

            muzzleFlashLight = new THREE.PointLight(0xff3300, 0, 18); 
            gunMesh.add(muzzleFlashLight);

            camera.add(gunMesh); scene.add(camera);

            updateGunAppearance(); 
            createObstacles();
            setupMobileControls();

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('keydown', initAudio, { once: true });

            let isDragging = false;
            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', (e) => {
                if(isDragging) { yaw -= e.movementX * 0.003; }
            });

            startWave(1); 
            animate();
        }

        function startWave(waveNum) {
            isWaveTransitioning = false;
            currentWave = waveNum;
            document.getElementById('wave-ui').innerText = `WAVE ${currentWave}`;
            
            let enemyCount = 3 + waveNum * 2;
            for (let i = 0; i < enemyCount; i++) spawnZombie();
        }

        function createMuzzleFlashParticles(flashPos, stats) {
            const particleCount = 6;
            const pGeo = new THREE.BoxGeometry(0.04, 0.04, 0.04);
            const pMat = new THREE.MeshBasicMaterial({ color: stats.color, transparent: true, opacity: 0.9 });

            const mPos = new THREE.Vector3(0.2, -0.25, flashPos);
            mPos.applyQuaternion(camera.quaternion); mPos.add(camera.position);
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);

            for(let i=0; i<particleCount; i++) {
                const pMesh = new THREE.Mesh(pGeo, pMat);
                pMesh.position.copy(mPos);
                const pVel = camDir.clone().multiplyScalar(0.12 + Math.random()*0.08);
                pVel.x += (Math.random() - 0.5) * 0.08; pVel.y += (Math.random() - 0.5) * 0.08; pVel.z += (Math.random() - 0.5) * 0.08;
                pMesh.userData = { velocity: pVel, life: 6 };
                scene.add(pMesh); flashParticles.push(pMesh);
            }
        }

        function updateGunAppearance() {
            if(!gunMesh) return;
            for(let i = gunMesh.children.length - 1; i >= 0; i--) {
                if(gunMesh.children[i] !== muzzleFlashLight) gunMesh.remove(gunMesh.children[i]);
            }
            const matSteel = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
            const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.25), matSteel); receiver.position.set(0, 0, -0.1);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.2), matSteel); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0, -0.25);
            gunMesh.add(receiver, barrel);
        }

        function createObstacles() {
            const boxGeo = new THREE.BoxGeometry(3, 6, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x607080, roughness: 0.5 }); 
            for(let i=0; i<8; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random() - 0.5) * 50, 3, (Math.random() - 0.5) * 50);
                if(box.position.length() > 10) { scene.add(box); obstacles.push(box); }
            }
        }

        function setupMobileControls() {
            const boundary = document.getElementById('joystick-boundary');
            const stick = document.getElementById('joystick-stick');
            const btnAttack = document.getElementById('btn-attack');

            boundary.addEventListener('touchstart', (e) => {
                joystickActive = true;
                const t = e.touches[0];
                joystickStart = { x: t.clientX, y: t.clientY };
            });

            document.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                const t = e.touches[0];
                let distX = t.clientX - joystickStart.x;
                let distY = t.clientY - joystickStart.y;
                const maxDist = 45;

                const angle = Math.atan2(distY, distX);
                const dist = Math.min(maxDist, Math.sqrt(distX*distX + distY*distY));

                joystickMove = {
                    x: (Math.cos(angle) * dist) / maxDist,
                    y: (Math.sin(angle) * dist) / maxDist
                };

                stick.style.transform = `translate(${joystickMove.x * maxDist}px, ${joystickMove.y * maxDist}px)`;
                
                player.moveForward = joystickMove.y < -0.2;
                player.moveBackward = joystickMove.y > 0.2;
                player.moveLeft = joystickMove.x < -0.2;
                player.moveRight = joystickMove.x > 0.2;
            });

            document.addEventListener('touchend', () => {
                if(joystickActive) {
                    joystickActive = false;
                    stick.style.transform = `translate(0px, 0px)`;
                    player.moveForward = player.moveBackward = player.moveLeft = player.moveRight = false;
                }
            });

            btnAttack.addEventListener('touchstart', (e) => { player.isShooting = true; e.preventDefault(); });
            btnAttack.addEventListener('touchend', () => { player.isShooting = false; });
        }

        function onKeyDown(e) {
            // [비밀 치트키 가동] UI엔 없지만 K 또는 'ㅋ'를 누르면 좀비 몰살
            if(e.code === 'KeyK') {
                killAllZombies();
                return;
            }
            switch (e.code) {
                case 'KeyW':
                case 'ArrowUp': player.moveForward = true; break;
                case 'KeyS':
                case 'ArrowDown': player.moveBackward = true; break;
                case 'KeyA': player.moveLeft = true; break;
                case 'KeyD': player.moveRight = true; break;
                case 'ArrowLeft': player.turnLeft = true; break;
                case 'ArrowRight': player.turnRight = true; break;
                case 'Space': player.isShooting = true; e.preventDefault(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW':
                case 'ArrowUp': player.moveForward = false; break;
                case 'KeyS':
                case 'ArrowDown': player.moveBackward = false; break;
                case 'KeyA': player.moveLeft = false; break;
                case 'KeyD': player.moveRight = false; break;
                case 'ArrowLeft': player.turnLeft = false; break;
                case 'ArrowRight': player.turnRight = false; break;
                case 'Space': player.isShooting = false; break;
            }
        }

        function killAllZombies() {
            if (enemies.length === 0 || isWaveTransitioning) return;
            for (let j = enemies.length - 1; j >= 0; j--) {
                spawnMedkit(enemies[j].position); 
                scene.remove(enemies[j]);
            }
            enemies = []; 
        }

        function playerShoot() {
            if (isWaveTransitioning) return;
            const now = Date.now();
            let stats = weaponStats[currentWeapon] || weaponStats['pistol'];
            if (now - lastShotTime < stats.delay) return;
            lastShotTime = now;

            playShootSound(); 

            muzzleFlashLight.color.setHex(stats.color);
            muzzleFlashLight.intensity = 5.0; 
            flashTimer = 4; 
            createMuzzleFlashParticles(stats.flashPos, stats);

            const shotDir = new THREE.Vector3(); 
            camera.getWorldDirection(shotDir);

            if (currentWeapon === 'shotgun') {
                for (let i = 0; i < stats.count; i++) {
                    const spreadDir = shotDir.clone().add(new THREE.Vector3((Math.random()-0.5)*0.12, (Math.random()-0.5)*0.12, (Math.random()-0.5)*0.12)).normalize();
                    createBullet(camera.position, spreadDir, stats);
                }
            } else {
                createBullet(camera.position, shotDir, stats);
            }
        }

        function createBullet(startPos, direction, stats) {
            const geo = new THREE.SphereGeometry(stats.size || 0.04, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: stats.color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(startPos).add(direction.clone().multiplyScalar(0.4));
            scene.add(mesh);

            bullets.push({ mesh: mesh, dir: direction.clone(), speed: stats.speed, dmg: stats.dmg, createdAt: Date.now() });
        }

        function changeWeapon(weaponType) {
            currentWeapon = weaponType;
            document.getElementById('current-weapon-txt').innerText = weaponStats[weaponType].name;
            updateGunAppearance();
            document.getElementById('weapons').blur();
        }

        function spawnMedkit(position) {
            if (Math.random() > 0.25) return; 

            const kitGroup = new THREE.Group();
            const boxGeo = new THREE.BoxGeometry(0.6, 0.3, 0.4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }); 
            const box = new THREE.Mesh(boxGeo, boxMat);
            kitGroup.add(box);

            const crossMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const hPart = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, 0.42), crossMat); hPart.position.y = 0.151;
            const vPart = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.42), crossMat); vPart.position.y = 0.151;
            kitGroup.add(hPart, vPart);

            kitGroup.position.copy(position);
            kitGroup.position.y = 0.15; 
            scene.add(kitGroup);
            
            kitGroup.userData = { spawnedAt: Date.now() };
            medkits.push(kitGroup);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (player.isShooting) playerShoot();

            if (flashTimer > 0) {
                flashTimer--;
                if (flashTimer <= 0) muzzleFlashLight.intensity = 0;
            }

            if (player.turnLeft) yaw += rotateSpeed;
            if (player.turnRight) yaw -= rotateSpeed;
            camera.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));

            const moveDir = new THREE.Vector3(); 
            camera.getWorldDirection(moveDir); 
            moveDir.y = 0; 
            moveDir.normalize();
            
            const camRight = new THREE.Vector3(); 
            camRight.crossVectors(camera.up, moveDir).negate().normalize();

            player.velocity.set(0, 0, 0);
            if (player.moveForward) player.velocity.add(moveDir);
            if (player.moveBackward) player.velocity.sub(moveDir);
            if (player.moveLeft) player.velocity.sub(camRight);
            if (player.moveRight) player.velocity.add(camRight);
            
            if(player.velocity.lengthSq() > 0) {
                const oldPosition = camera.position.clone();
                camera.position.add(player.velocity.normalize().multiplyScalar(player.speed));
                
                // 벽 충돌 체크 (안 뚫리게 막기)
                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    const diffX = Math.abs(camera.position.x - obs.position.x);
                    const diffZ = Math.abs(camera.position.z - obs.position.z);
                    if (diffX < 1.7 && diffZ < 1.7) {
                        camera.position.copy(oldPosition);
                        break;
                    }
                }
            }

            const now = Date.now();
            
            for(let i = medkits.length - 1; i >= 0; i--) {
                const kit = medkits[i];
                kit.rotation.y += 0.015; 
                if(camera.position.distanceTo(kit.position) < 0.9) {
                    player.hp = Math.min(player.maxHp, player.hp + 30); 
                    document.getElementById('hp-bar').style.width = player.hp + '%';
                    scene.remove(kit);
                    medkits.splice(i, 1);
                    continue;
                }
                if (now - kit.userData.spawnedAt > 15000) {
                    scene.remove(kit);
                    medkits.splice(i, 1);
                }
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                const zombie = enemies[j]; if(!zombie) continue;
                zombie.lookAt(camera.position.x, zombie.position.y, camera.position.z);
                
                const toPlayer = new THREE.Vector3().subVectors(camera.position, zombie.position); 
                toPlayer.y = 0;
                const distance = toPlayer.length();
                
                if (distance > 0.4) {
                    zombie.position.add(toPlayer.normalize().multiplyScalar(zombie.userData.speed));
                }
                
                if (distance < 0.55) {
                    if (now - player.lastHitTime > player.invincibleDuration) {
                        player.lastHitTime = now;
                        player.hp -= 5; 
                        document.getElementById('hp-bar').style.width = Math.max(0, player.hp) + '%';
                        
                        if (player.hp <= 0) {
                            alert("체력이 모두 소진되었습니다. 다시 시작합니다.");
                            location.reload();
                            return;
                        }
                    }
                }
            }

            for(let i = flashParticles.length - 1; i >= 0; i--) {
                const p = flashParticles[i]; p.position.add(p.userData.velocity); p.userData.life--;
                if(p.userData.life <= 0) { scene.remove(p); flashParticles.splice(i, 1); }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed));
                let removed = false;

                if (now - b.createdAt > 1800) removed = true;

                if (!removed) {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (b.mesh.position.distanceTo(enemies[j].position.clone().add(new THREE.Vector3(0,1.2,0))) < 1.3) {
                            enemies[j].userData.hp -= b.dmg;
                            if (enemies[j].userData.hp <= 0) { 
                                spawnMedkit(enemies[j].position); 
                                scene.remove(enemies[j]); 
                                enemies.splice(j, 1); 
                            }
                            removed = true; break;
                        }
                    }
                }

                if (removed) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }

            if(enemies.length === 0 && !isWaveTransitioning) {
                isWaveTransitioning = true;
                setTimeout(() => { startWave(currentWave + 1); }, 1500);
            }

            renderer.render(scene, camera);
        }

        function spawnZombie() {
            const zombieGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2e5c30, roughness: 0.7 }); 
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.5), bodyMat); 
            body.position.y = 0.7; zombieGroup.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), bodyMat);
            head.position.set(0, 1.6, 0); zombieGroup.add(head);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 
            const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.06), eyeMat); leftEye.position.set(-0.1, 1.65, -0.21);
            const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.06), eyeMat); rightEye.position.set(0.1, 1.65, -0.21);
            zombieGroup.add(leftEye, rightEye);

            const armMat = new THREE.MeshStandardMaterial({ color: 0x224424 });
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.7), armMat); leftArm.position.set(-0.45, 1.1, -0.3);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.7), armMat); rightArm.position.set(0.45, 1.1, -0.3);
            zombieGroup.add(leftArm, rightArm);

            let angle = Math.random() * Math.PI * 2; 
            let distance = 14 + Math.random() * 12;
            zombieGroup.position.set(Math.cos(angle) * distance, 0, Math.sin(angle) * distance);
            zombieGroup.userData = { hp: 100, speed: 0.048 }; 
            scene.add(zombieGroup); enemies.push(zombieGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
