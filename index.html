<!doctype html>
<html lang="ko" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브코딩 작품 전시관</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
        * { font-family: 'Pretendard', sans-serif; }
        .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
        .tab-active { background: #4F46E5; color: white; }
        .tip-box {  border: 1px solid rgba(6, 182, 212, 0.25);
                    border-radius: 12px;
                    padding: 1rem 1.5rem;
                    /* color: #67e8f9; */
                    font-size: 13px;
                    line-height: 1.9;
                    position: relative;
                    z-index: 10;
                    max-width: 1200px;
                    margin: 20px auto;
                    }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body class="h-full">
  <div id="app" class="h-full w-full bg-gradient-to-br from-indigo-50 via-white to-pink-50 overflow-auto">
   <!-- Header -->
   <header class="text-center py-12 px-4">
    <h1 id="main-title" class="text-4xl font-bold text-indigo-900 mb-2">🎮 바이브코딩 작품 전시관</h1>
    <p id="main-subtitle" class="text-lg text-gray-500">학생들의 창의적인 작품을 만나보세요</p>
   </header><!-- Tabs -->
   <nav id="tab-container" class="flex flex-wrap justify-center gap-2 px-4 mb-8">
   </nav><!-- Cards Grid -->

   <nav id="tab-container" class="flex flex-wrap justify-center gap-2 px-4 mb-8">
   </nav><!-- Cards Grid -->

  <main id="card-grid" class="max-w-6xl mx-auto px-4 pb-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
   </main><!-- Footer -->
   <footer class="text-center py-8 text-gray-400 text-sm">
    Made with 💜 Vibe Coding

       <div class="tip-box">
    📁 파일명 규칙: <strong>학교명_학생이름.html</strong> 형태로 저장하면 자동으로 갤러리에 표시됩니다.<br>
    예시: <strong>삼선중_홍길동.html</strong> &nbsp;/&nbsp; <strong>안성중_김민준.html</strong><br>
    <span style="color:#a78bfa;font-size:12px;">※ sample · test · README · index 파일은 자동으로 제외됩니다.</span>
  </div>

   </footer>
  </div>
  <script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  📌 비개발자 편집 가이드                                      ║
// ║  아래 DATA 부분만 수정하면 됩니다!                             ║
// ╚══════════════════════════════════════════════════════════════╝

// ─────────────────────────────────────────────
// 📂 그룹(탭) 설정
// - name: 탭에 표시될 이름
// - id: 고유 식별자 (영어, 공백 없이)
// ─────────────────────────────────────────────
const GROUPS = [
    { id: "all", name: "전체" },
    { id: "group1", name: "금가초" },
    // ✏️ 그룹 추가 예시:
    // { id: "group3", name: "3반" },
];


// ─────────────────────────────────────────────
// 🎮 학생 작품 목록
// - title: 게임/작품 이름
// - file: 파일명 (학교명_학생이름.html)
// - group: 위 GROUPS의 id와 일치해야 함
// - image: 게임 대표 이미지 URL (선택사항, 없으면 기본 이미지)
// ─────────────────────────────────────────────
const PROJECTS = [
    { title: "테트리스 게임", name: "엄세용", file: "금가초_엄○용.html", group: "group1", image: "" },
    { title: "우리반 친구 퀴즈", name: "이서율", file: "금가초_이○율.html", group: "group1", image: "" },
     { title: "강아지 견종 맞추기 퀴즈", name: "권이효", file: "금가초_권○효.html", group: "group1", image: "" },
   { title: "캣 점프", name: "강서은", file: "금가초—강○은.html", group: "group1", image: "" },

    // ✏️ 작품 추가 예시:
    // { title: "작품이름", file: "학교명_학생이름.html", group: "group1", image: "" },
];

// ═══════════════════════════════════════════════
// ⚠️ 아래부터는 수정하지 마세요!
// ═══════════════════════════════════════════════

// 파일명에서 개발자 이름 추출 & 마스킹
function getDeveloperName(filename) {
    const nameWithExt = filename.split('_')[1] || '';
    const name = nameWithExt.replace('.html', '');
    if (name.length <= 2) return name;
    return name[0] + '○'.repeat(name.length - 2) + name[name.length - 1];
}

// 게임 이미지 생성 (다양한 스타일의 SVG)
function getDefaultImage(title, seed) {
    const gameIcons = ['🎮','🕹️','🎯','🚀','⭐','💎','🎲','🏆','🌟','🎪','🎨','🎭'];
    const gradients = [
        { from: '#818CF8', to: '#F472B6' },
        { from: '#34D399', to: '#10B981' },
        { from: '#FBBF24', to: '#F59E0B' },
        { from: '#60A5FA', to: '#3B82F6' },
        { from: '#A78BFA', to: '#8B5CF6' },
        { from: '#FB7185', to: '#F43F5E' },
        { from: '#06B6D4', to: '#0891B2' },
        { from: '#EC4899', to: '#DB2777' },
        { from: '#14B8A6', to: '#0D9488' },
        { from: '#F97316', to: '#EA580C' },
    ];
    
    const hash = seed + title.length;
    const gradient = gradients[hash % gradients.length];
    const icon = gameIcons[hash % gameIcons.length];
    const pattern = Math.floor(hash / gradients.length) % 3;
    
    let patternSvg = '';
    if (pattern === 1) {
        patternSvg = `<defs><pattern id="dots" x="20" y="20" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.3)"/></pattern></defs><rect width="300" height="200" fill="url(#dots)"/>`;
    } else if (pattern === 2) {
        patternSvg = `<defs><pattern id="lines" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="2"/></pattern></defs><rect width="300" height="200" fill="url(#lines)"/>`;
    }
    
    return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:${gradient.from};stop-opacity:1" /><stop offset="100%" style="stop-color:${gradient.to};stop-opacity:1" /></linearGradient></defs><rect width="300" height="200" fill="url(#grad)" rx="8"/>${patternSvg}<text x="150" y="105" text-anchor="middle" fill="white" font-size="60" opacity="0.9">${icon}</text></svg>`)}`;
}

let activeGroup = 'all';

function renderTabs() {
    const container = document.getElementById('tab-container');
    container.innerHTML = GROUPS.map(g => `
        <button onclick="filterGroup('${g.id}')" 
            class="px-4 py-2 rounded-full text-sm font-medium transition-all ${activeGroup === g.id ? 'tab-active' : 'bg-white text-gray-600 hover:bg-indigo-100 border border-gray-200'}"
        >${g.name}</button>
    `).join('');
}

function renderCards() {
    const grid = document.getElementById('card-grid');
    const filtered = activeGroup === 'all' ? PROJECTS : PROJECTS.filter(p => p.group === activeGroup);
    
    grid.innerHTML = filtered.map((p, index) => {
        const dev = getDeveloperName(p.file);
        const img = p.image || getDefaultImage(p.title, index);
        return `
        <a href="${p.file}" target="_blank" rel="noopener noreferrer" class="card-hover block bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100">
            <div class="h-40 overflow-hidden">
                <img src="${img}" alt="${p.title}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.background='linear-gradient(135deg,#818CF8,#F472B6)';this.src='';">
            </div>
            <div class="p-4">
                <h3 class="font-semibold text-gray-800 text-base mb-1">${p.title}</h3>
                <p class="text-sm text-gray-400"><i data-lucide="user" style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:4px;"></i>${dev}</p>
            </div>
        </a>`;
    }).join('');
    
    lucide.createIcons();
}

function filterGroup(id) {
    activeGroup = id;
    renderTabs();
    renderCards();
}

// Init
renderTabs();
renderCards();

// Element SDK
const defaultConfig = {
    page_title: '🎮 바이브코딩 작품 전시관',
    page_subtitle: '학생들의 창의적인 작품을 만나보세요',
    background_color: '#EEF2FF',
    surface_color: '#FFFFFF',
    text_color: '#312E81',
    primary_action_color: '#4F46E5',
    secondary_action_color: '#6B7280',
    font_family: 'Pretendard',
    font_size: 16
};

function applyConfig(config) {
    document.getElementById('main-title').textContent = config.page_title || defaultConfig.page_title;
    document.getElementById('main-subtitle').textContent = config.page_subtitle || defaultConfig.page_subtitle;
    const app = document.getElementById('app');
    app.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color}, white, #FDF2F8)`;
    document.querySelectorAll('.card-hover').forEach(c => { c.style.backgroundColor = config.surface_color || defaultConfig.surface_color; });
    document.getElementById('main-title').style.color = config.text_color || defaultConfig.text_color;
    const font = config.font_family || defaultConfig.font_family;
    document.body.style.fontFamily = `${font}, sans-serif`;
    const size = config.font_size || defaultConfig.font_size;
    document.getElementById('main-title').style.fontSize = `${size * 2.5}px`;
    document.getElementById('main-subtitle').style.fontSize = `${size * 1.1}px`;
}

window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => { applyConfig(config); },
    mapToCapabilities: (config) => ({
        recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }},
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }},
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }},
            { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); }},
            { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); }},
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }},
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }}
    }),
    mapToEditPanelValues: (config) => new Map([
        ["page_title", config.page_title || defaultConfig.page_title],
        ["page_subtitle", config.page_subtitle || defaultConfig.page_subtitle]
    ])
});
</script>
