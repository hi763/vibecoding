<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우리반 친구 퀴즈</title>



<style>

body {

    font-family: 'Malgun Gothic', sans-serif;

    background-color: #f0f8ff;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    margin: 0;

}



.quiz-container {

    background-color: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow: 0 4px 10px rgba(0,0,0,0.1);

    max-width: 500px;

    width: 100%;

}



h1 {

    text-align: center;

    color: #333;

    margin-bottom: 30px;

}



.quiz-item {

    margin-bottom: 25px;

    padding: 15px;

    border-bottom: 1px dashed #ccc;

}



.question {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;

}



input {

    width: 100%;

    padding: 10px;

    border: 1px solid #ccc;

    border-radius: 8px;

    box-sizing: border-box;

}



button {

    margin-top: 10px;

    padding: 8px 15px;

    border: none;

    border-radius: 8px;

    background-color: #3498db;

    color: white;

    cursor: pointer;

}



button:hover {

    background-color: #2980b9;

}



.result {

    margin-top: 10px;

    font-weight: bold;

}

</style>

</head>



<body>



<div class="quiz-container">

    <h1>✨ 우정 테스트 퀴즈 ✨</h1>



    <div class="quiz-item">

        <div class="question">1번. 얼굴이 가장 동그란 친구는?</div>

        <input type="text" id="q1" placeholder="답을 입력하세요">

        <button onclick="checkAnswer('q1','이연서','r1')">정답 확인</button>

        <div id="r1" class="result"></div>

    </div>



    <div class="quiz-item">

        <div class="question">2번. 아침에 머리카락이 산발인 친구는?</div>

        <input type="text" id="q2" placeholder="답을 입력하세요">

        <button onclick="checkAnswer('q2','기선우','r2')">정답 확인</button>

        <div id="r2" class="result"></div>

    </div>



    <div class="quiz-item">

        <div class="question">3번. 쉬는 시간에 가장 조용한 친구는?</div>

        <input type="text" id="q3" placeholder="답을 입력하세요">

        <button onclick="checkAnswer('q3','김소유','r3')">정답 확인</button>

        <div id="r3" class="result"></div>

    </div>



</div>



<script>

function checkAnswer(inputId, correctAnswer, resultId) {

    const userAnswer = document.getElementById(inputId).value.trim();

    const result = document.getElementById(resultId);



    if (userAnswer === correctAnswer) {

        result.innerHTML = "✅ 정답입니다!";

        result.style.color = "green";

    } else {

        result.innerHTML = "❌ 틀렸습니다!";

        result.style.color = "red";

    }

}

</script>



</body>

</html>
